template: /app/gateway-base.yaml
# Note: OAuth configuration is in gateway-base.yaml or via environment variables
# To enable API key generation feature, set:
# oauth.enable_api_key: true
# or environment variable: OAUTH_ENABLE_API_KEY=true

# Multi-provider configuration (new format):
# default_provider: keycloak
# providers:
#   keycloak:
#     issuer_url: https://keycloak.example.com/realms/myrealm
#     client_id: my-client
#     client_secret: my-secret
#     redirect_url: /oauth/callback
#     scopes: [openid, profile, email]
#   google:
#     issuer_url: https://accounts.google.com
#     client_id: google-client-id
#     client_secret: google-client-secret
#     redirect_url: /oauth/callback
#     scopes: [openid, profile, email]
#
# Per-client provider assignment (add to client config):
#   provider: keycloak    # references a named provider
#   # clients without 'provider' field use default_provider
default_provider: keycloak
providers:
  keycloak:
    issuer_url: ${OAUTH_ISSUERURL}
    client_id: ${OAUTH_CLIENTID}
    client_secret: ${OAUTH_CLIENTSECRET}
    redirect_url: /oauth/callback
    scopes: [openid, profile, email]
  auth:
   issuer_url: ${PL_ISSUERURL}
   client_id: ${PL_CLIENT_ID}
   client_secret: ${PL_CLIENT_SECRET}
   redirect_url: /oauth/callback
   scopes: [openid, profile, email]

listener:
  address: 0.0.0.0
  port: 8081
oauth:
  session_cookie_name: pkgw
  session_secure: false
  session_http_only: true
  session_same_site: Lax
super_users:
  - demo
clients:
  - id: keycloak #required
    description: "Keycloak IdP — auth UI exposed under /auth/, no gateway auth"
    address: keycloak # required
    domain: 192.168.88.100:8081
    port: 8080 # default 8080
    ssl: false # default false
    exclude: true # default false
    prefix: /auth/ #default /
    # enabled: false   # uncomment to keep this entry but skip it at xDS generation
    sso_injection: true
    sso_appurl: http://localhost:8081/auth
    sso_appname: Keycloak
  - id: admin_cluster #required
    address: httpbin.org # required
    domain: localhost:8081
    port: 443 # default 8080
    ssl: true # default false
    exclude: false
    sso_injection: true
    sso_appurl: http://localhost:8081/
    sso_appname: Admin
    prefix: /
    exclude_paths: # optional
      - /healthz
      - /metrics
  - id: echo_service_cluster
    domain: localhost:8081
    host_rewrite: httpbin.org
    address: http-echo
    port: 8080
    ssl: false
    exclude: false
    add_token: true
    prefix: /echo
    prefix_rewrite: /get
    sso_injection: true
    sso_appurl: http://localhost:8081/echo
    sso_appname: Echo
    allowed_users:
      - admin
    exclude_paths:
      - /status/200
      - /status/201
#  - id: echo2_service_cluster
#    domain: local.home:8081
#    host_rewrite: httpbin.org
#    address: http-echo
#    port: 8080
#    ssl: false
#    exclude: false
#    exclude_paths:
#      - /favicon.ico
  # websocket example
  - id: chat_service_cluster
    domain: local.home:8081
    address: host.docker.internal
    port: 9888
    ssl: false
    exclude: false
  - id: shortsui_service_cluster
    domain: localhost:8081,192.168.88.100:8081
    address: shorts
    port: 8080
    prefix: /sui
    provider: auth
    sso_injection: true
    sso_appurl: http://localhost:8081/sui
    sso_appname: Shorts
    allowed_users:
      - "*"
  - id: shorts_service_cluster
    domain: localhost:8081
    address: shorts
    port: 8080
    prefix: /s/
    exclude: true
