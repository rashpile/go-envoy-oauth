name: CI/CD Pipeline

# Runs on both hosts of this repo:
# - Gitea Actions (gitea.rashpile.net), which reads .github/workflows/ directly. Its
#   built-in token is rejected by the container registry, so registry login uses the
#   account-level secrets REGISTRY_USER / REGISTRY_TOKEN shared by every repo.
# - GitHub Actions (the public mirror), which publishes to ghcr.io with GITHUB_TOKEN.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # Registry host: ghcr.io on GitHub, the Gitea registry elsewhere. A repo variable
  # REGISTRY overrides both, so a fork can push elsewhere without editing this file.
  REGISTRY: ${{ vars.REGISTRY || (github.server_url == 'https://github.com' && 'ghcr.io' || 'gitea.rashpile.net') }}
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

  build-and-push:
    name: Build and Push Image
    needs: test
    runs-on: ubuntu-latest
    # Only publish on push to main/master, on a tag, or on a manual run; PRs only test.
    if: github.event_name != 'pull_request'
    # GitHub needs packages: write for ghcr.io; Gitea ignores this block.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # act_runner serves the GHA cache API on the host network.
          driver-opts: network=host

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.server_url == 'https://github.com' && github.actor || secrets.REGISTRY_USER }}
          password: ${{ github.server_url == 'https://github.com' && secrets.GITHUB_TOKEN || secrets.REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          annotations: |
            org.opencontainers.image.description=OAuth 2.0/OIDC authentication filter for Envoy Proxy

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-standalone-image:
    name: Build Standalone Envoy Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.server_url == 'https://github.com' && github.actor || secrets.REGISTRY_USER }}
          password: ${{ github.server_url == 'https://github.com' && secrets.GITHUB_TOKEN || secrets.REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-standalone
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          annotations: |
            org.opencontainers.image.description=Standalone Envoy with OAuth authentication

      - name: Build and push standalone image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile-envoy
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
